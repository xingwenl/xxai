# 容器 stdout 日志（docker logs）统一限额，避免 /var/lib/docker/containers 下的
# json-file 无上限增长；应用内的文件日志由 apps/backend/app/core/logging.py 自行按天轮转。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 后端服务共享的环境变量；各服务在自己环境块里用 << 合并后再覆盖差异项
# （例如 LOG_FILE_PATH，必须按服务区分，否则多个服务会写同一个日志文件）。
x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  APP_VERSION: ${APP_VERSION:-0.0.1}
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD: ${DB_PASSWORD:-Dd123456}
  DB_NAME: ${DB_NAME:-ai_db}
  DB_HOST: db
  DB_PORT: 5432
  DATABASE_URL: postgresql+asyncpg://${DB_USER:-root}:${DB_PASSWORD:-Dd123456}@db:5432/${DB_NAME:-ai_db}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  AGENT_FILE_STORAGE_PATH: /app/storage
  SKILL_RUNNER_URL: http://skill-runner:8090
  SKILL_RUNNER_SHARED_SECRET: ${SKILL_RUNNER_SHARED_SECRET:-dev-skill-runner-secret-change-me}
  SKILL_RUNNER_TIMEOUT_SECONDS: ${SKILL_RUNNER_TIMEOUT_SECONDS:-30}
  SKILL_RUNNER_MAX_OUTPUT_BYTES: ${SKILL_RUNNER_MAX_OUTPUT_BYTES:-65536}
  # MCP 出站安全开关：默认 false，只允许公网可达的 MCP endpoint（防 SSRF）。
  # 置 true 后额外放行回环与私网地址，容器内访问宿主机自建 MCP 服务需要开启
  # （例如 http://host.docker.internal:4545/mcp）；链路本地地址始终拒绝。
  MCP_ALLOW_PRIVATE_ENDPOINTS: ${MCP_ALLOW_PRIVATE_ENDPOINTS:-false}
  # 容器默认是 UTC，日志文件名（date.today()）与时间戳会与宿主机差 8 小时，
  # 统一到 Asia/Shanghai，保证文件名日期、日志时间和宿主机一致。
  TZ: ${TZ:-Asia/Shanghai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
  IMAGE_GENERATION_TIMEOUT_SECONDS: ${IMAGE_GENERATION_TIMEOUT_SECONDS:-180}
  EMBED_CLIENT_ID: ${EMBED_CLIENT_ID:-}
  EMBED_CLIENT_SECRET: ${EMBED_CLIENT_SECRET:-}
  EMBED_AGENT_ID: ${EMBED_AGENT_ID:-0}
  EMBED_ORIGIN: ${EMBED_ORIGIN:-http://localhost:5173}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-}
  ATTACHMENT_EMBEDDING_PROVIDER: ${ATTACHMENT_EMBEDDING_PROVIDER:-}
  ATTACHMENT_EMBEDDING_MODEL: ${ATTACHMENT_EMBEDDING_MODEL:-}
  ATTACHMENT_EMBEDDING_BASE_URL: ${ATTACHMENT_EMBEDDING_BASE_URL:-}
  ATTACHMENT_EMBEDDING_API_KEY: ${ATTACHMENT_EMBEDDING_API_KEY:-}
  ATTACHMENT_EMBEDDING_DIMENSION: ${ATTACHMENT_EMBEDDING_DIMENSION:-}
  QUOTA_ENABLED: ${QUOTA_ENABLED:-false}
  CONVERSATION_HISTORY_WINDOW_SECONDS: ${CONVERSATION_HISTORY_WINDOW_SECONDS:-3600}
  AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-}

services:
  db:
    # pgvector 官方镜像（基于 PostgreSQL 17，预装 vector 扩展）；
    # 官方 postgres 镜像不带 pgvector，alembic 迁移执行 CREATE EXTENSION vector 会失败
    # 本地与服务器统一升级到 PG17（本地既有数据卷由 PG17 初始化，pg16 无法读取）
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Dd123456}
      POSTGRES_DB: ${DB_NAME:-ai_db}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432" # 127.0.0.1:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # ollama:
  #   profiles: ["local-embedding"]
  #   image: ollama/ollama:latest
  #   ports:
  #     - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12

  # ollama-init:
  #   profiles: ["local-embedding"]
  #   image: ollama/ollama:latest
  #   entrypoint: ["/bin/sh", "-c"]
  #   environment:
  #     OLLAMA_HOST: http://ollama:11434
  #     OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  #   command: ["ollama pull \"$${OLLAMA_EMBEDDING_MODEL}\""]
  #   depends_on:
  #     ollama:
  #       condition: service_healthy

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *backend-environment
      # 每个服务独立日志文件：多进程/多容器写同一个文件会互相穿插并被彼此的清理策略影响
      LOG_FILE_PATH: /app/logs/api/app.log
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/backend/logs:/app/logs
      - ./apps/backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - skill-runner-network

  worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: celery -A app.modules.knowledge.tasks:celery_app worker --loglevel=INFO
    environment:
      <<: *backend-environment
      # Celery worker 单独落盘，避免与 api 日志互相穿插
      LOG_FILE_PATH: /app/logs/worker/app.log
    volumes:
      - ./apps/backend/logs:/app/logs
      - ./apps/backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  wechat-bot-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.wechat-bot
    command: python -m app.modules.wechat_bot.worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *backend-environment
      # 微信机器人单独落盘：原有的每分钟心跳曾占共享日志近一半行数
      LOG_FILE_PATH: /app/logs/wechat-bot/app.log
      WECHAT_BOT_ENABLED: ${WECHAT_BOT_ENABLED:-false}
      WECHAT_BOT_SYSTEM_PROMPT: ${WECHAT_BOT_SYSTEM_PROMPT:-你是「ai-base」的微信 AI 助手。用简洁、准确的中文回答用户问题，不要输出 Markdown 格式符号，尽量直接给出答案。}
      WECHAT_BOT_MAX_REPLY_CHARS: ${WECHAT_BOT_MAX_REPLY_CHARS:-4000}
      # 对话经后台 chat 接口转发（api 容器内地址）；单容器并发实例上限
      WECHAT_BOT_API_BASE_URL: ${WECHAT_BOT_API_BASE_URL:-http://api:8000}
      WECHAT_BOT_MAX_INSTANCES: ${WECHAT_BOT_MAX_INSTANCES:-20}
      # 登录凭据与长轮询游标持久化目录（挂载到宿主机，重启容器后免扫码）
      WECHAT_BOT_STATE_DIR: /app/data/wechat_bot
      # 容器内无法直接访问宿主机的 127.0.0.1，模型网关默认经 host.docker.internal 访问
      OPENAI_BASE_URL: ${WECHAT_BOT_OPENAI_BASE_URL:-http://host.docker.internal:8800/v1}
    volumes:
      - ./apps/backend/logs:/app/logs
      - ./apps/backend/storage:/app/storage
      - ./apps/backend/data/wechat_bot:/app/data/wechat_bot
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    logging: *default-logging

  # 任务调度：常驻进程，按 tick 抢占到期任务并发起无人值守的一轮 Agent 运行。
  # 与 api/worker 分开部署，避免 API 重启中断调度、也避免多副本重复触发。
  task-scheduler:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: python -m app.modules.tasks.scheduler
    environment:
      <<: *backend-environment
      # 调度进程单独落盘，避免与 api/worker 日志互相穿插
      LOG_FILE_PATH: /app/logs/task-scheduler/app.log
      TASK_SCHEDULER_ENABLED: ${TASK_SCHEDULER_ENABLED:-true}
      TASK_SCHEDULER_TICK_SECONDS: ${TASK_SCHEDULER_TICK_SECONDS:-30}
      TASK_DEFAULT_TIMEOUT_SECONDS: ${TASK_DEFAULT_TIMEOUT_SECONDS:-600}
      TASK_MAX_PER_PLATFORM: ${TASK_MAX_PER_PLATFORM:-100}
    volumes:
      - ./apps/backend/logs:/app/logs
      - ./apps/backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  skill-runner:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.runner
    environment:
      SKILL_STORAGE_ROOT: /app/storage
      SKILL_RUNNER_SHARED_SECRET: ${SKILL_RUNNER_SHARED_SECRET:-dev-skill-runner-secret-change-me}
    volumes:
      - ./apps/backend/storage:/app/storage:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    networks:
      - skill-runner-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  front:
    build:
      context: ./apps/front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    logging: *default-logging

volumes:
  postgres_data:
    # 复用旧 apps/backend Compose 创建的数据卷，避免切换根目录 Compose 后看到空库。
    external: true
    name: ${POSTGRES_VOLUME_NAME:-backend_postgres_data}
  redis_data:
  ollama_data:

networks:
  skill-runner-network:
    internal: true
