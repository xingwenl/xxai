# ai-base 反向代理配置（宿主机 nginx）
# 部署脚本会自动复制到 /etc/nginx/conf.d/ai-base.conf 并 reload
# 有域名时把 server_name 改成你的域名，并用 certbot 自动签发 HTTPS：
#   yum install -y epel-release certbot python2-certbot-nginx
#   certbot --nginx -d 你的域名

server {
    listen 80;
    # server_name _;   # 无域名用 IP 访问；有域名改为 你的域名

    # 文件上传大小（知识库/附件），与前端容器 nginx 保持一致
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（前端 socket.io-client）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 长连接（对话流式输出），关闭缓冲避免流式响应被卡住
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
   listen 8088;

    root /var/www/shop;   # 建议移出 /root 目录
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 转发 /hua8-api 到外部域名 hua8.bbtree.xyz =====
    location /hua8-api {
        proxy_pass http://hua8.bbtree.xyz;
        proxy_http_version 1.1;

        proxy_set_header Host hua8.bbtree.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Vite 中 ws: true 对应）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===== 转发 /api 到本地后端服务 127.0.0.1:8000 =====
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # index.html 不缓存，保证每次拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
