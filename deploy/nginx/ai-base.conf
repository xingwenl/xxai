# ai-base 反向代理配置（宿主机 nginx）
# 部署脚本会自动复制到 /etc/nginx/conf.d/ai-base.conf 并 reload
# 有域名时把 server_name 改成你的域名，并用 certbot 自动签发 HTTPS：
#   yum install -y epel-release certbot python2-certbot-nginx
#   certbot --nginx -d 你的域名

server {
    listen 80;
    server_name _;   # 无域名用 IP 访问；有域名改为 你的域名

    # 文件上传大小（知识库/附件），与前端容器 nginx 保持一致
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket（前端 socket.io-client）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 长连接（对话流式输出），关闭缓冲避免流式响应被卡住
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
  listen 8088; # 监听端口

  location / {
  # client_max_body_size 1024m;
    add_header Cache-Control max-age=31536000;
    try_files $uri /index.html;
  }
  location ~* .*\.html$ {
    add_header Cache-Control max-age=10000;
  }
  # add_header Cache-Control max-age=31536000;
  index index.html index.php; # 默认访问文件
  root /root/front/shop;  # 接收到域名转发至相匹配目录
}
