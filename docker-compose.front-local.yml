# 前端本地快速迭代覆盖文件。
#
# 背景：`docker compose up -d --build front` 每次都要在镜像里跑两遍 pnpm install
# （ai-sdk + front）再加两次 vite 构建，单次几分钟；而本机 `pnpm exec vite build`
# 只需要 2~3 秒。因此本地不必再重建 front 镜像，直接让 nginx 容器读宿主机上
# apps/front/dist 的构建产物即可。
#
# 用法：
#   cd apps/front && pnpm exec vite build          # 改完代码重新构建（2~3s）
#   docker compose -f docker-compose.yml -f docker-compose.front-local.yml up -d front
#
# 之后只改代码就不再需要任何 docker 命令：重新 vite build 后 nginx 立即读到新文件，
# 浏览器刷新即可（index.html 引用带 hash 的新资源）。
#
# 回到「真镜像」模式：不带这个覆盖文件执行
#   docker compose up -d --build front
services:
  front:
    # 用官方 nginx 镜像顶掉 front 镜像，避免触发 Dockerfile 里的 SDK 构建与两次 pnpm install
    build: !reset null
    image: nginx:1.27-alpine
    volumes:
      # 与 apps/front/Dockerfile 的最后一层等价：沿用同一份 nginx 配置和同一个发布目录
      - ./apps/front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/front/dist:/usr/share/nginx/html:ro
