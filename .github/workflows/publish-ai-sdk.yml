name: Publish ai-sdk to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Type check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ai-sdk/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --run

  publish:
    name: Publish to npm registry
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
