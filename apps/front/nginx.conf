server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文件上传大小（知识库/附件），与宿主机 nginx 保持一致
    client_max_body_size 100m;

    location /api/ {
        # 后端容器重建后会换 IP，而 nginx 只在启动时解析一次上游域名。
        # 这里改用 Docker 内嵌 DNS（127.0.0.11）+ 变量式 proxy_pass，让 nginx
        # 按 valid 周期重新解析，避免 api 容器重建后前端一直 502。
        # 注意：proxy_pass 带变量时必须写成「只到 host:port、不带路径」的形式，
        # 否则 nginx 不会原样透传请求 URI。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 长连接（对话流式输出），关闭缓冲避免流式响应被卡住
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
