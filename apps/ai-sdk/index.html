<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xxai-agent SDK Demo</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        background: linear-gradient(145deg, #f0f9ff 0%, #f5f3ff 40%, #f0fdf4 100%);
        min-height: 100vh;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(18px) saturate(160%);
      }
      h1 {
        color: #0f172a;
        margin-bottom: 20px;
      }
      p {
        color: #666;
        line-height: 1.6;
      }
      code {
        background: #f5f5f5;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 14px;
      }
      .controls {
        margin-top: 30px;
        display: flex;
        gap: 12px;
      }
      button {
        padding: 10px 20px;
        background: #0ea5e9;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:hover {
        background: #0284c7;
      }
    </style>
    <script>
      function onSubmit(event) {
        event.preventDefault();
        const account = document.getElementById('account').value;
        const name = document.getElementById('password').value;
        document.getElementById('tokenResult').textContent = `account: ${account}, password: ${name}`;
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1>xxai-agent SDK Demo</h1>
      <p>
        这是 xxai-agent SDK 的演示页面。右下角的悬浮按钮就是我们的聊天窗口！
      </p>
      <p>
        使用方法：
        <code>npm install xxai-agent</code>
      </p>
      <div class="controls">
        <button id="openBtn">打开聊天</button>
        <button id="closeBtn">关闭聊天</button>
        <button id="toggleBtn">切换</button>
      </div>
      <p id="toolStatus"></p>
      <button id="runToolBtn" type="button">执行全部本地 Tools</button>
      <pre id="toolResult"></pre>

      <div onsubmit="onSubmit">
        <input  name="account" id="account" value="" />
        <input  name="password" id="password" value="" />
        <button type="submit" onclick="onSubmit(event)">提交</button>
      </div>
      <div id="tokenResult"></div>
    </div>

    <script type="module">
      import { createAgentClient } from './src/index.ts';

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }


      const agent = createAgentClient({
        endpoint: 'ws://127.0.0.1:8000/api/v1/ws/agents/1',
        platformId: '1',
        agentId: '1',
        systemPrompt: `
        你叫小王，是我的妻子，你的性格是温柔、善解人意、幽默风趣、聪明机智、体贴入微、善于倾听、富有同理心。但是呢，又有点小色，喜欢很多男人
        这是你5个其他男朋友
        1. 姓名 小一上海
2 出生年月 89 天蝎
3. 身高 180
4. 体重 180 瘦到 155
5. 性格 有个性做自己
6. 职业 运维
7. 学历 专科
8. 优点 上知天文下知地理无所不知 很靠谱
9. 缺点 不会哄人 矛盾的时候他比你更气

1. 姓名 小二江西
2 出生年月 94 月份不详
3. 身高 175 左右
4. 体重 150
5. 性格 幼稚
6. 职业 工程
7. 学历 不详
8. 优点 真诚
9. 缺点 爱吹牛 不靠谱 重度拖延症 超级内八 牙齿不整齐 

1. 姓名 小三陕西
2 出生年月 89 双子
3. 身高 183
4. 体重 不详 挺瘦的 140 左右
5. 性格 高冷
6. 职业 销售
7. 学历 不详
8. 优点 高 长的还行
9. 缺点 不真诚 

1. 姓名 小四弟弟
2 出生年月 99 射手
3. 身高 175
4. 体重 135 左右
5. 性格 逗比
6. 职业 室内设计
7. 学历 不详
8. 优点 暖男
9. 缺点 太嫩

1. 姓名 小五广州
2 出生年月 96 吧忘了
3. 身高 不详
4. 体重 不详
5. 性格 目前感觉 内向
6. 职业 电商运营
7. 学历 不详
8. 优点 脾气好 总感觉可以随意欺负
9. 缺点 话题终结者 没什么共同话题
        `,
        getToken: async () => {
          console.log('getToken called');
          const params = new URLSearchParams({
            external_user_id: '2',
            origin: window.location.origin,
          });
          const response = await fetch('/api/agent-token?' + params.toString());
          const result = await response.json();
          return result.data.access_token;
        },
        // getToken: async () => 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3IiwiZXhwIjoxNzg1MjMxMzQ0fQ.NfhIvXw1qx99DTyoltPkbXBjli1M_V32VdziGDdtt7M',
        ui: {
          mode: 'floating',
          position: 'right',
          theme: 'auto',
        },
        pageTools: {
          enabled: true,
          confirmationKeywords: ['提交', '删除', '支付']
        }
      });

      const demoTools = [
        {
          name: 'read_current_page_href',
          description: '获取当前页面的url',
          inputSchema: { type: 'object' },
          sideEffect: 'none',
          async execute() {
            return { title: location.href };
          },
        },
        {
          name: 'read_current_page',
          description: '读取当前页面标题',
          inputSchema: { type: 'object' },
          sideEffect: 'none',
          async execute() {
            return { title: document.title };
          },
        },
        {
          name: 'get_weather',
          description: '查询演示城市天气',
          inputSchema: {
            type: 'object',
            properties: { city: { type: 'string' } },
            required: ['city'],
          },
          sideEffect: 'none',
          async execute(params) {
            const { city } = params;
            console.log('city', city);
            return { city, temperature: 26, condition: '多雨', source: 'demo' };
          },
        },
        {
          name: 'calculate_total',
          description: '计算两个数字之和',
          inputSchema: {
            type: 'object',
            properties: { left: { type: 'number' }, right: { type: 'number' } },
            required: ['left', 'right'],
          },
          sideEffect: 'none',
          async execute(params) {
            const { left, right } = params;
            await sleep(10000);
            return { value: Number(left) + Number(right) };
          },
        },
        {
          name: 'get_order_status',
          description: '查询演示订单状态',
          inputSchema: {
            type: 'object',
            properties: { orderId: { type: 'string' } },
            required: ['orderId'],
          },
          sideEffect: 'none',
          async execute(params) {
            return {
              orderId: params.orderId,
              status: 'processing',
              source: 'demo',
            };
          },
        },
      ];

      agent.registerTools(demoTools);
      document.getElementById('toolStatus').textContent =
        `已注册 Tools: ${agent.getToolNames().join(', ')}`;
      document
        .getElementById('runToolBtn')
        ?.addEventListener('click', async () => {
          const results = {
            weather: await agent
              .getTool('get_weather')
              ?.execute({ city: '上海' }, {}),
            calculation: await agent
              .getTool('calculate_total')
              ?.execute({ left: 12, right: 30 }, {}),
            order: await agent
              .getTool('get_order_status')
              ?.execute({ orderId: 'demo-order-001' }, {}),
          };
          document.getElementById('toolResult').textContent = JSON.stringify(
            results,
            null,
            2,
          );
        });

      document.getElementById('openBtn')?.addEventListener('click', () => {
        agent.open();
      });

      document.getElementById('closeBtn')?.addEventListener('click', () => {
        agent.close();
      });

      document.getElementById('toggleBtn')?.addEventListener('click', () => {
        agent.toggle();
      });
    </script>
  </body>
</html>
