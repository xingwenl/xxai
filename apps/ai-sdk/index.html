<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xxai-agent SDK Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    p {
      color: #666;
      line-height: 1.6;
    }
    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #5a67d8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>xxai-agent SDK Demo</h1>
    <p>
      这是 xxai-agent SDK 的演示页面。右下角的悬浮按钮就是我们的聊天窗口！
    </p>
    <p>
      使用方法：
      <code>npm install xxai-agent</code>
    </p>
    <div class="controls">
      <button id="openBtn">打开聊天</button>
      <button id="closeBtn">关闭聊天</button>
      <button id="toggleBtn">切换</button>
    </div>
    <p id="toolStatus"></p>
    <button id="runToolBtn" type="button">执行全部本地 Tools</button>
    <pre id="toolResult"></pre>
  </div>

  <script type="module">
    import { createAgentClient } from './src/index.ts'

    const agent = createAgentClient({
      endpoint: 'ws://127.0.0.1:8000/api/v1/ws/agents/1',
      platformId: '1',
      agentId: '1',
      getToken: async () => {
        const params = new URLSearchParams({
          external_user_id: '2',
          origin: window.location.origin
        })
        for (const name of ['get_weather', 'calculate_total', 'get_order_status']) {
          params.append('host_tool_names', name)
        }
        const response = await fetch('/api/agent-token?' + params.toString())
        const result = await response.json()
        return result.data.access_token
      },
      // getToken: async () => 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3IiwiZXhwIjoxNzg1MjMxMzQ0fQ.NfhIvXw1qx99DTyoltPkbXBjli1M_V32VdziGDdtt7M',
      ui: {
        mode: 'floating',
        position: 'right',
        theme: 'auto'
      },
    })

    const demoTools = [
      {
        name: 'get_weather',
        description: '查询演示城市天气',
        inputSchema: {
          type: 'object',
          properties: { city: { type: 'string' } },
          required: ['city']
        },
        sideEffect: 'none',
        async execute(params) {
          const { city } = params
          console.log('city', city)
          return { city, temperature: 26, condition: '多雨', source: 'demo' }
        }
      },
      {
        name: 'calculate_total',
        description: '计算两个数字之和',
        inputSchema: {
          type: 'object',
          properties: { left: { type: 'number' }, right: { type: 'number' } },
          required: ['left', 'right']
        },
        sideEffect: 'none',
        async execute(params) {
          const { left, right } = params
          return { value: Number(left) + Number(right) }
        }
      },
      {
        name: 'get_order_status',
        description: '查询演示订单状态',
        inputSchema: {
          type: 'object',
          properties: { orderId: { type: 'string' } },
          required: ['orderId']
        },
        sideEffect: 'none',
        async execute(params) {
          return { orderId: params.orderId, status: 'processing', source: 'demo' }
        }
      }
    ]

    agent.registerTools(demoTools)
    document.getElementById('toolStatus').textContent =
      `已注册 Tools: ${agent.getToolNames().join(', ')}`
    document.getElementById('runToolBtn')?.addEventListener('click', async () => {
      const results = {
        weather: await agent.getTool('get_weather')?.execute({ city: '上海' }, {}),
        calculation: await agent.getTool('calculate_total')?.execute({ left: 12, right: 30 }, {}),
        order: await agent.getTool('get_order_status')?.execute({ orderId: 'demo-order-001' }, {})
      }
      document.getElementById('toolResult').textContent = JSON.stringify(results, null, 2)
    })

    document.getElementById('openBtn')?.addEventListener('click', () => {
      agent.open()
    })

    document.getElementById('closeBtn')?.addEventListener('click', () => {
      agent.close()
    })

    document.getElementById('toggleBtn')?.addEventListener('click', () => {
      agent.toggle()
    })
  </script>
</body>
</html>
