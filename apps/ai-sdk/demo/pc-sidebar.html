<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xxai-agent PC 双栏会话列表验证页</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <style>
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f1f5f9; }
      .page { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }
      button.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
      #chat-root { height: 620px; width: 1000px; max-width: 100%; border: 1px dashed #94a3b8; border-radius: 12px; overflow: hidden; background: #fff; }
      code { background: #e2e8f0; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="toolbar">
        <strong>验证：</strong>
        <button id="toggle-mode">切到 floating 模式</button>
        <button id="toggle-layout">切到 single 布局</button>
      </div>
      <div class="toolbar">
        <span style="font-size:13px;color:#475569">embedded 容器宽度：</span>
        <button data-width="1000" class="active">1000px</button>
        <button data-width="520">520px</button>
        <span style="font-size:13px;color:#475569">floating 窗口宽度：</span>
        <button data-float-width="430" class="active">430px</button>
        <button data-float-width="900">900px</button>
      </div>
      <div id="chat-root"></div>
      <p style="color:#475569;font-size:13px">
        左侧列表数据来自被 stub 的 <code>fetch</code>；点击列表项应加载对应历史消息。
        floating 模式下列表宽窄应由「悬浮窗实际宽度」决定，而不是浏览器视口宽度。
      </p>
    </div>

    <script type="module">
      import { createAgentClient } from '../dist/xxai-agent.es.js'

      // 用内存数据替掉真实 HTTP：验证页只关心 UI 行为，不依赖后端。
      const conversations = [
        { id: 1, title: '订单查询', created_at: '2026-09-20T08:00:00Z', message_count: 2, last_message_preview: '你的订单已发货' },
        { id: 2, title: '退款流程', created_at: '2026-09-19T08:00:00Z', message_count: 1, last_message_preview: '退款需要 3 个工作日' }
      ]
      const history = {
        1: [
          { id: 11, role: 'user', content: '我的订单到哪了？', created_at: '2026-09-20T08:00:00Z' },
          { id: 12, role: 'assistant', content: '你的订单已发货。', created_at: '2026-09-20T08:01:00Z' }
        ],
        2: [
          { id: 21, role: 'user', content: '怎么退款？', created_at: '2026-09-19T08:00:00Z' }
        ]
      }
      const deleted = new Set()

      // 记录列表接口被调用次数，用于断言「流式期间不重复拉列表」。
      let listCalls = 0
      // 记录 conversations_changed 事件，便于区分「事件没发」与「UI 没刷」。
      const changedEvents = []

      window.fetch = async (url, init) => {
        const target = String(url)
        const respond = (data) => ({ ok: true, status: 200, json: async () => ({ success: true, code: 0, data }) })
        if (target.includes('/embed/conversations?') || target.endsWith('/embed/conversations')) {
          listCalls += 1
          const items = conversations.filter((c) => !deleted.has(c.id))
          return respond({ items, total: items.length, page: 1, page_size: 20 })
        }
        const match = target.match(/\/embed\/conversations\/(\d+)\/messages/)
        if (match) return respond(history[Number(match[1])] || [])
        const del = target.match(/\/embed\/conversations\/(\d+)$/)
        if (del && init?.method === 'DELETE') {
          deleted.add(Number(del[1]))
          return respond(null)
        }
        return { ok: false, status: 404, json: async () => ({}) }
      }

      const base = {
        endpoint: 'ws://127.0.0.1:9/api/v1/ws/agents/1',
        baseUrl: 'http://127.0.0.1:9/api/v1',
        platformId: 'p',
        agentId: '1',
        user: { id: 'u' },
        getToken: async () => 'mock-token'
      }

      const root = document.getElementById('chat-root')
      let agent = null
      let layout = 'desktop'
      let mode = 'embedded'
      let floatWidth = 430

      /** 悬浮模式下窗口挂在 document.body，探针范围随之切换。 */
      function ctx() { return mode === 'embedded' ? root : document }

      function mount() {
        if (agent) { agent.destroy(); agent = null }
        root.innerHTML = ''
        root.style.display = mode === 'embedded' ? '' : 'none'
        changedEvents.length = 0
        // 悬浮窗尺寸会被持久化，且已保存的矩形优先于 `window` 配置。验证页
        // 需要确定的宽度，因此每次挂载前清掉上一次运行的窗口矩形，避免
        // 上一轮拉宽到 900px 后影响下一轮的 430px 断言。
        try { globalThis.localStorage.removeItem('xxai-agent:p:1:u:window') } catch {}
        const ui = mode === 'embedded'
          ? { mode: 'embedded', container: root, layout, theme: 'light' }
          : { mode: 'floating', position: 'right', layout, theme: 'light', window: { width: floatWidth, height: 600 } }
        agent = createAgentClient({ ...base, ui })
        agent.on('conversations_changed', (payload) => changedEvents.push(payload))
        window.__agent = agent
        // 悬浮窗默认关闭，点开才能断言窗口内部结构。
        if (mode === 'floating') agent.open()
      }
      mount()

      document.querySelectorAll('[data-width]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-width]').forEach((b) => b.classList.remove('active'))
          btn.classList.add('active')
          root.style.width = btn.dataset.width + 'px'
        })
      })

      document.querySelectorAll('[data-float-width]').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-float-width]').forEach((b) => b.classList.remove('active'))
          btn.classList.add('active')
          floatWidth = Number(btn.dataset.floatWidth)
          if (mode === 'floating') {
            // 悬浮窗尺寸会被持久化（用户拖拽结果优先于配置默认值），验证页
            // 需要确定性的宽度，因此切换前清掉已保存的窗口矩形。
            try { globalThis.localStorage.removeItem('xxai-agent:p:1:u:window') } catch {}
            mount()
          }
        })
      })

      document.getElementById('toggle-mode').addEventListener('click', (event) => {
        mode = mode === 'embedded' ? 'floating' : 'embedded'
        event.target.textContent = mode === 'embedded' ? '切到 floating 模式' : '切到 embedded 模式'
        event.target.classList.toggle('active', mode === 'floating')
        mount()
      })

      document.getElementById('toggle-layout').addEventListener('click', (event) => {
        layout = layout === 'desktop' ? 'single' : 'desktop'
        event.target.textContent = layout === 'desktop' ? '切到 single 布局' : '切到 desktop 布局'
        event.target.classList.toggle('active', layout === 'single')
        mount()
      })

      // 模拟「用户发一条消息，后端创建了新会话」：SDK 内部 transport 是真实
      // WebSocket，这里直接向它注入网关事件，复现聊天后列表不刷新的场景。
      // sequence 必须全局单调递增（与真实网关一致），否则会被 SDK 的去重
      // 逻辑当成重复事件丢弃，导致后续消息不产生任何回调。
      let injectedSequence = 0
      window.__sendAndComplete = (text, newConversationId) => {
        agent.sendMessage(text)
        const transport = agent.transport
        const emit = (event) => transport.emit('message', {
          protocolVersion: 1,
          timestamp: new Date().toISOString(),
          ...event
        })
        const next = () => ++injectedSequence
        emit({
          id: `e${next()}`, type: 'message_started', sequence: injectedSequence, requestId: `r${injectedSequence}`,
          conversationId: newConversationId, payload: {}
        })
        emit({
          id: `e${next()}`, type: 'message_delta', sequence: injectedSequence, requestId: `r${injectedSequence}`,
          conversationId: newConversationId, payload: { content: '收到' }
        })
        emit({
          id: `e${next()}`, type: 'message_completed', sequence: injectedSequence, requestId: `r${injectedSequence}`,
          conversationId: newConversationId, payload: { content: '收到' }
        })
        // 后端在新会话落库后，列表接口应能查到它。
        const existing = conversations.find((c) => c.id === Number(newConversationId))
        if (existing) {
          existing.message_count += 2
          existing.last_message_preview = '收到'
        } else {
          conversations.push({
            id: Number(newConversationId),
            title: text,
            created_at: new Date().toISOString(),
            message_count: 2,
            last_message_preview: '收到'
          })
        }
      }

      // 供自动化断言读取的探针。
      window.__probe = () => {
        const c = ctx()
        const sidebar = c.querySelector('.xxai-conversation-sidebar')
        const windowEl = c.querySelector('.xxai-chat-window')
        const resetEl = c.querySelector('.xxai-reset')
        const mainEl = c.querySelector('.xxai-chat-main')
        const rect = (el) => (el ? Math.round(el.getBoundingClientRect().width) : 0)
        return {
          mode,
          layout,
          hasSidebar: Boolean(sidebar),
          sidebarWidth: rect(sidebar),
          windowWidth: rect(windowEl),
          chatAreaWidth: rect(mainEl),
          windowClass: windowEl ? windowEl.className : '',
          itemTitles: [...c.querySelectorAll('.xxai-sidebar-item-title')].map((n) => n.textContent.trim()),
          activeTitle: c.querySelector('.xxai-sidebar-item.is-active .xxai-sidebar-item-title')?.textContent.trim() || null,
          messages: agent ? agent.getMessages().map((m) => m.content.text) : [],
          conversationId: agent ? agent.currentConversationId : undefined,
          listCalls,
          changedEvents: changedEvents.slice(),
          innerWidth: window.innerWidth,
          rootClientWidth: root.clientWidth,
          resetClientWidth: rect(resetEl)
        }
      }
    </script>
  </body>
</html>
