<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xxai-agent SDK Demo (ESM)</title>
  <!-- 引入样式文件 -->
  <link rel="stylesheet" href="../dist/style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    p {
      color: #666;
      line-height: 1.6;
    }
    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #5a67d8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>xxai-agent SDK Demo (ESM)</h1>
    <p>
      这是 xxai-agent SDK 的 ESM 版本演示页面。
    </p>
    <p>
      使用方法：
      <code>npm install xxai-agent</code>
    </p>
    <div class="controls">
      <button id="openBtn">打开聊天</button>
      <button id="closeBtn">关闭聊天</button>
      <button id="toggleBtn">切换</button>
    </div>
  </div>

  <!-- 引入 ESM 包 -->
  <script type="module">
    import { createAgentClient } from '../dist/xxai-agent.es.js'

    const agent = createAgentClient({
      endpoint: 'wss://api.example.com',
      platformId: 'platform-123',
      agentId: 'agent-456',
      getToken: async () => 'mock-token',
      ui: {
        mode: 'floating',
        position: 'right',
        theme: 'auto'
      }
    })

    document.getElementById('openBtn')?.addEventListener('click', () => {
      agent.open()
    })

    document.getElementById('closeBtn')?.addEventListener('click', () => {
      agent.close()
    })

    document.getElementById('toggleBtn')?.addEventListener('click', () => {
      agent.toggle()
    })
  </script>
</body>
</html>
